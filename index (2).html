<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Banking FAQ Assistant</title><style>body{font-family:Arial;margin:0;background:#eef3f8;display:flex;justify-content:center;padding:30px}.box{max-width:800px;width:100%;background:white;border-radius:16px;box-shadow:0 8px 25px #bbb;overflow:hidden}.head{background:#173f6b;color:white;text-align:center;padding:28px}.head h1{margin:0 0 8px}.main{padding:28px}label{font-weight:bold;display:block;margin-bottom:10px}textarea{width:100%;height:110px;padding:12px;border:2px solid #ccd5df;border-radius:9px;font-size:16px;box-sizing:border-box}button{width:100%;padding:13px;margin-top:12px;border:0;border-radius:9px;background:#173f6b;color:white;font-size:16px;font-weight:bold;cursor:pointer}.clear{background:#777}.examples{margin-top:18px}.ex{display:inline-block;background:#edf2f7;color:#173f6b;padding:8px 11px;border-radius:18px;margin:4px;cursor:pointer;font-size:13px}.result{display:none;margin-top:22px;padding:20px;background:#f7f9fc;border-left:5px solid #173f6b;border-radius:8px}.row{margin-bottom:14px}.title{font-weight:bold;color:#555;margin-bottom:4px}.value{line-height:1.5}.foot{text-align:center;padding:15px;color:#777;font-size:12px;border-top:1px solid #eee}</style></head><body><div class="box"><div class="head"><h1>Banking FAQ Assistant</h1><div>Ask your banking question and get an instant answer</div></div><div class="main"><label>Enter your banking question</label><textarea id="q" placeholder="Example: I lost my ATM card. What should I do?"></textarea><button onclick="ask()">ASK</button><button class="clear" onclick="clearAll()">CLEAR</button><div class="examples"><b>Try an example:</b><br><span class="ex" onclick="use('How can I check my bank balance?')">Check balance</span><span class="ex" onclick="use('I lost my ATM card')">Lost ATM card</span><span class="ex" onclick="use('Why did my UPI payment fail?')">UPI failed</span><span class="ex" onclick="use('I forgot my internet banking password')">Forgot password</span><span class="ex" onclick="use('Can I share my OTP?')">OTP safety</span></div><div class="result" id="r"><div class="row"><div class="title">User Question</div><div class="value" id="uq"></div></div><div class="row"><div class="title">Category</div><div class="value" id="cat"></div></div><div class="row"><div class="title">Matched FAQ</div><div class="value" id="faq"></div></div><div class="row"><div class="title">Answer</div><div class="value" id="ans"></div></div><div class="row"><div class="title">Confidence Score</div><div class="value" id="score"></div></div></div></div><div class="foot">Static Context Based Banking FAQ Assistance System</div></div><script>const data=[['Account',['how can i check my account balance','how do i check my bank balance','how can i see my account balance','what is my bank balance','how to check balance'],"Check your balance through the bank's official mobile app, internet banking, ATM, or branch."],['ATM / Debit Card',['my atm card is missing','i lost my atm card','my debit card is lost','what should i do if my atm card is lost','atm card missing'],'Block the lost card immediately using an official banking channel or contact bank support.'],['UPI',['why did my upi payment fail','upi payment failed','why is my upi transaction failing','upi is not working','my upi payment was unsuccessful'],'A UPI payment can fail due to connectivity, bank-server, limit, account, or beneficiary issues. Check the official transaction status.'],['Net Banking',['i forgot my internet banking password what should i do','i forgot my net banking password','how can i reset my internet banking password','internet banking password forgotten','how do i reset my net banking password'],'Use the official forgot-password or password-reset option. Never share your password or OTP.'],['Security',['should i share my otp with anyone','can i share my otp','is it safe to share otp','can i tell someone my otp','should i give my otp to bank staff'],'No. Never share an OTP, PIN, password, CVV, or authentication information with anyone.'],['Account',['how do i open a bank account','i want to open a new bank account','what is required to open a bank account'],'You can open an account through the bank\'s official website, mobile application, or branch. Follow the bank\'s official KYC requirements.'],['ATM / Debit Card',['how can i change my atm pin','how do i change my debit card pin','how to change atm pin'],'Use your bank\'s official ATM, mobile banking application, or internet banking option to change your PIN.'],['UPI',['how can i create a upi id','how do i set up upi','i want to create a upi id'],'Create a UPI ID using your bank\'s official UPI-enabled mobile banking application and follow the registration instructions.'],['Transactions',['my money was deducted but the transaction failed','money deducted but transaction failed','amount deducted but payment failed','payment failed but money was deducted'],'Check the official transaction status first. If the transaction failed, the amount is generally reversed according to the bank\'s applicable process and timeline.'],['Credit Card',['how can i pay my credit card bill','how do i pay my credit card payment','credit card bill payment'],'Pay your credit card bill through the bank\'s official mobile app, internet banking, branch, or other officially supported payment methods.'],['Loans',['how can i apply for a bank loan','i want to apply for a loan','how do i get a bank loan'],'Apply through the bank\'s official website, mobile application, or branch. Eligibility, documents, interest rates, and approval depend on the bank\'s policies.'],['Charges',['why was a bank charge deducted','why did the bank deduct charges','what is this bank charge','why was money deducted as a bank fee'],'Bank charges can apply for services such as ATM usage, transfers, account maintenance, or other transactions. Check the official fee schedule or transaction details.']];function clean(s){return s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}function sim(a,b){let A=new Set(clean(a).split(' ').filter(x=>x.length>2)),B=new Set(clean(b).split(' ').filter(x=>x.length>2));let c=0;A.forEach(x=>{if(B.has(x))c++});return A.size&&B.size?2*c/(A.size+B.size):0}function find(q){let best=null,bs=0;data.forEach(x=>x[1].forEach(f=>{let s=sim(q,f);if(s>bs){bs=s;best={cat:x[0],faq:f,ans:x[2]}}}));return{best,bs}}function ask(){let q=document.getElementById('q').value.trim();if(!q){alert('Please enter a banking question.');return}let z=find(q);document.getElementById('uq').textContent=q;if(z.best&&z.bs>=.2){document.getElementById('cat').textContent=z.best.cat;document.getElementById('faq').textContent=z.best.faq;document.getElementById('ans').textContent=z.best.ans}else{document.getElementById('cat').textContent='General / Unknown';document.getElementById('faq').textContent='No suitable FAQ found';document.getElementById('ans').textContent='Sorry, I could not find a reliable answer for this question. Please contact your bank through an official customer-support channel.'}document.getElementById('score').textContent=z.bs.toFixed(3);document.getElementById('r').style.display='block'}function use(x){document.getElementById('q').value=x;ask()}function clearAll(){document.getElementById('q').value='';document.getElementById('r').style.display='none'}document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});</script></body></html>
